version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3-alpine
    container_name: civic-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-civic_db}
      POSTGRES_USER: ${POSTGRES_USER:-civic_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civic_password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d
    networks:
      - civic-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: civic-redis
    ports:
      - "6379:6379"
    networks:
      - civic-network
    restart: unless-stopped

  backend:
    image: civic-backend:latest
    container_name: civic-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-civic_db}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-civic_user}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-civic_password}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production-use-a-64-char-hex-string}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
    networks:
      - civic-network
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: civic-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - civic-network
    restart: unless-stopped

volumes:
  pgdata:

networks:
  civic-network:
    driver: bridge
