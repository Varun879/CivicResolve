apiVersion: apps/v1
kind: Deployment
metadata:
  name: civic-frontend
  labels:
    app: civic-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: civic-frontend
  template:
    metadata:
      labels:
        app: civic-frontend
    spec:
      containers:
      - name: frontend
        image: civic-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
